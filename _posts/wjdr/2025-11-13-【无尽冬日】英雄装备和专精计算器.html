        // 保存数据到localStorage
        function saveData() {
            const inputs = document.querySelectorAll('input[type="number"]');
            const data = {};
            
            inputs.forEach(input => {
                data[input.id] = input.value;
            });
            
            localStorage.setItem('equipmentData', JSON.stringify(data));
        }

        // 从localStorage加载数据
        function loadData() {
            const savedData = localStorage.getItem('equipmentData');
            
            if (savedData) {
                const data = JSON.parse(savedData);
                
                for (const id in data) {
                    const input = document.getElementById(id);
                    if (input) {
                        input.value = data[id];
                    }
                }
                
                return true;
            }
            
            return false;
        }

        // 重置所有数据
        function resetData() {
            if (confirm('确定要重置所有装备等级和专精数据吗？')) {
                const inputs = document.querySelectorAll('input[type="number"]');
                
                inputs.forEach(input => {
                    if (input.id.includes('_spec')) {
                        input.value = 0;
                    } else {
                        input.value = 0;
                    }
                });
                
                localStorage.removeItem('equipmentData');
                document.getElementById('equipment-result').innerHTML = '<p class="priority">数据已重置，请输入装备等级后点击"英雄装备强化分析"按钮</p>';
                document.getElementById('spec-result').innerHTML = '<p class="priority">数据已重置，请输入专精等级后点击"专精强化分析"按钮</p>';
            }
        }

        // 检查专精等级是否符合要求
        function checkSpecRequirements(level, spec) {
            if (level >= 101 && level <= 119 && spec < 10) return false;
            if (level >= 120 && level <= 139 && spec < 11) return false;
            if (level >= 140 && level <= 159 && spec < 12) return false;
            if (level >= 160 && level <= 179 && spec < 13) return false;
            if (level >= 180 && level <= 199 && spec < 14) return false;
            if (level === 200 && spec < 15) return false;
            return true;
        }

        // 获取专精最低要求
        function getMinSpecRequirement(level) {
            if (level >= 101 && level <= 119) return 10;
            if (level >= 120 && level <= 139) return 11;
            if (level >= 140 && level <= 159) return 12;
            if (level >= 160 && level <= 179) return 13;
            if (level >= 180 && level <= 199) return 14;
            if (level === 200) return 15;
            return 0;
        }

        // 分析装备函数
        function analyzeEquipment() {
            let minStage = Infinity;
            let targetEquipment = null;
            let nextLevel = null;
            let results = [];
            
            let specWarnings = [];
            
            // 检查所有装备
            for (const [id, levels] of Object.entries(equipmentData)) {
                const currentLevel = parseInt(document.getElementById(id).value) || 0;
                const currentSpec = parseInt(document.getElementById(`${id}_spec`).value) || 0;
                
                // 检查专精等级是否符合要求
                if (!checkSpecRequirements(currentLevel, currentSpec)) {
                    const minSpec = getMinSpecRequirement(currentLevel);
                    specWarnings.push({
                        name: equipmentNames[id],
                        currentSpec,
                        minSpec
                    });
                }
                
                // 确定当前阶段
                let currentStage = 0;
                for (let i = 0; i < levels.length; i++) {
                    if (levels[i] === null) break;
                    if (currentLevel >= levels[i]) {
                        currentStage = i + 1;
                    } else {
                        break;
                    }
                }
                
                // 确定下一阶段和目标等级
                let nextStage = currentStage;
                let targetLevel = null;
                
                for (let i = currentStage; i < levels.length; i++) {
                    if (levels[i] !== null && levels[i] > currentLevel) {
                        nextStage = i + 1;
                        targetLevel = levels[i];
                        break;
                    }
                }
                
                // 记录结果
                results.push({
                    id: id,
                    name: equipmentNames[id],
                    currentLevel: currentLevel,
                    currentSpec: currentSpec,
                    currentStage: currentStage,
                    nextStage: nextStage,
                    targetLevel: targetLevel
                });
                
                // 更新最低阶段装备
                if (currentStage < minStage && targetLevel !== null) {
                    minStage = currentStage;
                    targetEquipment = id;
                    nextLevel = targetLevel;
                }
            }
            
            // 保存当前输入
            saveData();
            
            // 存储装备升级建议
            if (targetEquipment) {
                equipmentUpgradeRecommendation = {
                    id: targetEquipment,
                    targetLevel: nextLevel
                };
            }
            
            // 显示结果
            displayEquipmentResults(results, targetEquipment, nextLevel, specWarnings);
        }

        // 分析专精函数
        function analyzeSpecialization() {
            let bestSpecValue = -1;
            let bestSpecEquipment = null;
            let specCost = null;
            let results = [];
            
            let specWarnings = [];
            
            // 检查所有装备
            for (const [id, levels] of Object.entries(equipmentData)) {
                const currentLevel = parseInt(document.getElementById(id).value) || 0;
                const currentSpec = parseInt(document.getElementById(`${id}_spec`).value) || 0;
                
                // 检查专精等级是否符合要求
                if (!checkSpecRequirements(currentLevel, currentSpec)) {
                    const minSpec = getMinSpecRequirement(currentLevel);
                    specWarnings.push({
                        name: equipmentNames[id],
                        currentSpec,
                        minSpec
                    });
                }
                
                // 计算专精升级性价比
                let specValue = 0;
                let nextSpecCost = null;
                
                if (currentSpec < 20 && currentLevel > 0) {
                    const baseStat = equipmentBaseStats[id][currentLevel - 1] || 0;
                    const gain = 0.1 * baseStat;
                    nextSpecCost = specCosts[currentSpec];
                    specValue = gain / nextSpecCost;
                }
                
                // 记录结果
                results.push({
                    id: id,
                    name: equipmentNames[id],
                    currentLevel: currentLevel,
                    currentSpec: currentSpec,
                    specValue: specValue,
                    nextSpecCost: nextSpecCost
                });
                
                // 更新最佳专精升级
                if (specValue > bestSpecValue && currentSpec < 20) {
                    bestSpecValue = specValue;
                    bestSpecEquipment = id;
                    specCost = nextSpecCost;
                }
            }
            
            // 保存当前输入
            saveData();
            
            // 存储专精升级建议
            if (bestSpecEquipment) {
                specUpgradeRecommendation = {
                    id: bestSpecEquipment
                };
            }
            
            // 显示结果
            displaySpecResults(results, bestSpecEquipment, bestSpecValue, specCost, specWarnings);
        }

        // 显示装备分析结果
        function displayEquipmentResults(results, targetEquipment, nextLevel, specWarnings) {
            const resultDiv = document.getElementById('equipment-result');
            let html = '';
            
            // 显示专精警告
            if (specWarnings.length > 0) {
                html += `<div class="priority">专精等级不足警告</div>`;
                html += `<p class="target">以下装备的专精等级不符合要求：</p>`;
                
                for (const warning of specWarnings) {
                    html += `<p class="warning">${warning.name}: 当前专精 ${warning.currentSpec}, 要求至少 ${warning.minSpec}</p>`;
                }
                
                html += `<p class="target">请优先提升这些装备的专精等级</p>`;
            }
            
            if (targetEquipment) {
                const equipmentName = equipmentNames[targetEquipment];
                html += `<div class="priority">优先强化部位: ${equipmentName}</div>`;
                
                if (nextLevel !== null) {
                    html += `<p class="target">下一阶段需要提升到等级: <span class="highlight">${nextLevel}</span></p>`;
                } else {
                    html += `<p class="target">该装备已经达到最高等级，无需强化</p>`;
                }
            } else {
                html += `<p class="priority">所有装备均已达到最高等级，无需强化</p>`;
            }
            
            html += '<div class="details-title">各装备阶段详情:</div>';
            html += '<div class="table-container">';
            html += '<table>';
            html += '<tr><th>装备</th><th>等级</th><th>专精</th><th>阶段</th><th>下一目标</th><th>专精状态</th></tr>';
            
            for (const result of results) {
                const specStatus = checkSpecRequirements(result.currentLevel, result.currentSpec) ? 
                    '<span class="ok">符合</span>' : 
                    `<span class="warning">不足(需${getMinSpecRequirement(result.currentLevel)})</span>`;
                
                html += `<tr>
                    <td>${result.name}</td>
                    <td>${result.currentLevel}</td>
                    <td>${result.currentSpec}</td>
                    <td>${result.currentStage}</td>
                    <td>${result.targetLevel || 'MAX'}</td>
                    <td>${specStatus}</td>
                </tr>`;
            }
            
            html += '</table>';
            html += '</div>';
            
            resultDiv.innerHTML = html;
            
            // 切换到装备结果标签
            document.querySelectorAll('.result-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector('[data-tab="equipment-result"]').classList.add('active');
            document.getElementById('equipment-result').classList.add('active');
        }

                return true;
            } else {
                alert(`${equipmentNames[id]}的专精等级已经达到最大值`);
                return false;
            }
        }

        // 高亮显示输入框
        function highlightInput(input) {
            input.classList.add('changed');
            setTimeout(() => {
                input.classList.remove('changed');
            }, 1000);
        }

        // 自动升级装备
        function startAutoUpgradeEquipment() {
            if (autoUpgradeInterval) {
                stopAutoUpgrade();
                return;
            }
            
            autoUpgradeType = 'equipment';
            autoUpgradeCount = 0;
            
            // 更新UI状态
            document.getElementById('auto-equipment-btn').textContent = '停止自动升级装备';
            document.getElementById('auto-spec-btn').disabled = true;
            document.getElementById('stop-auto-btn').disabled = false;
            document.getElementById('auto-upgrade-status').style.display = 'block';
            updateAutoUpgradeStatus();
            
            // 开始自动升级
            autoUpgradeInterval = setInterval(() => {
                analyzeEquipment();
                
                if (equipmentUpgradeRecommendation) {
                    const success = acceptEquipmentRecommendation();
                    if (success) {
                        autoUpgradeCount++;
                        updateAutoUpgradeStatus();
                    } else {
                        stopAutoUpgrade();
                        alert('自动升级装备完成！');
                    }
                } else {
                    stopAutoUpgrade();
                    alert('自动升级装备完成！');
                }
            }, 1000);
        }

        // 自动升级专精
        function startAutoUpgradeSpec() {
            if (autoUpgradeInterval) {
                stopAutoUpgrade();
                return;
            }
            
            autoUpgradeType = 'spec';
            autoUpgradeCount = 0;
            
            // 更新UI状态
            document.getElementById('auto-spec-btn').textContent = '停止自动升级专精';
            document.getElementById('auto-equipment-btn').disabled = true;
            document.getElementById('stop-auto-btn').disabled = false;
            document.getElementById('auto-upgrade-status').style.display = 'block';
            updateAutoUpgradeStatus();
            
            // 开始自动升级
            autoUpgradeInterval = setInterval(() => {
                analyzeSpecialization();
                
                if (specUpgradeRecommendation) {
                    const success = acceptSpecRecommendation();
                    if (success) {
                        autoUpgradeCount++;
                        updateAutoUpgradeStatus();
                    } else {
                        stopAutoUpgrade();
                        alert('自动升级专精完成！');
                    }
                } else {
                    stopAutoUpgrade();
                    alert('自动升级专精完成！');
                }
            }, 1000);
        }

        // 停止自动升级
        function stopAutoUpgrade() {
            if (autoUpgradeInterval) {
                clearInterval(autoUpgradeInterval);
                autoUpgradeInterval = null;
                
                // 恢复UI状态
                document.getElementById('auto-equipment-btn').textContent = '自动连续升级装备';
                document.getElementById('auto-spec-btn').textContent = '自动连续升级专精';
                document.getElementById('auto-equipment-btn').disabled = false;
                document.getElementById('auto-spec-btn').disabled = false;
                document.getElementById('stop-auto-btn').disabled = true;
                document.getElementById('auto-upgrade-status').style.display = 'none';
                
                autoUpgradeType = null;
            }
        }

        // 更新自动升级状态
        function updateAutoUpgradeStatus() {
            const statusElement = document.getElementById('auto-upgrade-status');
            const countElement = document.getElementById('auto-upgrade-count');
            
            countElement.textContent = autoUpgradeCount;
            
            if (autoUpgradeType === 'equipment') {
                statusElement.innerHTML = `自动升级装备进行中... 已执行 <span class="highlight">${autoUpgradeCount}</span> 次升级`;
            } else if (autoUpgradeType === 'spec') {
                statusElement.innerHTML = `自动升级专精进行中... 已执行 <span class="highlight">${autoUpgradeCount}</span> 次升级`;
            }
        }

        // 初始化函数
        function init() {
            // 加载保存的数据
            const hasData = loadData();
            
            // 添加事件监听
            document.getElementById('analyze-equipment-btn').addEventListener('click', analyzeEquipment);
            document.getElementById('analyze-spec-btn').addEventListener('click', analyzeSpecialization);
            document.getElementById('accept-equipment-btn').addEventListener('click', acceptEquipmentRecommendation);
            document.getElementById('accept-spec-btn').addEventListener('click', acceptSpecRecommendation);
            document.getElementById('auto-equipment-btn').addEventListener('click', startAutoUpgradeEquipment);
            document.getElementById('auto-spec-btn').addEventListener('click', startAutoUpgradeSpec);
            document.getElementById('stop-auto-btn').addEventListener('click', stopAutoUpgrade);
            document.getElementById('reset-btn').addEventListener('click', resetData);
            
            // 添加标签切换事件
            document.querySelectorAll('.result-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    document.querySelectorAll('.result-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(tabId).classList.add('active');
                });
            });
            
            // 添加输入变化监听，自动保存和高亮显示
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                input.addEventListener('change', function() {
                    saveData();
                    highlightInput(this);
                });
                input.addEventListener('input', function() {
                    saveData();
                    highlightInput(this);
                });
            });
            
            // 如果有数据，自动分析装备
            if (hasData) {
                analyzeEquipment();
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
