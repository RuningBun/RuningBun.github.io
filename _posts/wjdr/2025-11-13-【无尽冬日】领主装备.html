        // 全局变量
        let currentBestOption = null;
        let autoUpgradeInterval = null;
        let isAutoUpgrading = false;

        // 获取装备的下一个等级
        function getNextLevel(currentLevel) {
            const levels = Object.keys(equipmentData);
            const currentIndex = levels.indexOf(currentLevel);
            if (currentIndex === -1 || currentIndex === levels.length - 1) {
                return null;
            }
            return levels[currentIndex + 1];
        }

        // 计算当前总属性值
        function calculateTotalStats(levels) {
            let minLevel = levels[0];
            let stats = 0;
            
            // 计算基础属性
            for (let i = 0; i < levels.length; i++) {
                const level = levels[i];
                const equipment = equipmentData[level];
                
                if (i === 0) stats += equipment.clothes;
                else if (i === 1) stats += equipment.pants;
                else if (i === 2) stats += equipment.ring;
                else if (i === 3) stats += equipment.staff;
                else if (i === 4) stats += equipment.hat;
                else if (i === 5) stats += equipment.watch;
                
                // 找出最小等级
                const levelPrice = equipment.price;
                const minLevelPrice = equipmentData[minLevel].price;
                if (levelPrice < minLevelPrice) {
                    minLevel = level;
                }
            }
            
            // 计算六件套属性
            stats += equipmentData[minLevel].sixSet;
            
            // 计算三件套属性
            const sortedLevels = [...levels].sort((a, b) => equipmentData[b].price - equipmentData[a].price);
            const top3MinLevel = sortedLevels[2];
            stats += equipmentData[top3MinLevel].threeSet;
            
            return stats;
        }

        // 高亮显示变化的装备
        function highlightEquipment(index) {
            const equipmentElements = [
                document.getElementById('clothes'),
                document.getElementById('pants'),
                document.getElementById('ring'),
                document.getElementById('staff'),
                document.getElementById('hat'),
                document.getElementById('watch')
            ];
            
            const equipmentItems = document.querySelectorAll('.equipment-item');
            const selectElement = equipmentElements[index];
            const itemElement = equipmentItems[index];
            
            // 添加高亮类
            selectElement.classList.add('highlight');
            itemElement.classList.add('highlight');
            
            // 1秒后移除高亮类
            setTimeout(() => {
                selectElement.classList.remove('highlight');
                itemElement.classList.remove('highlight');
            }, 1000);
        }

        // 接受强化建议
        function acceptUpgrade() {
            if (!currentBestOption) {
                alert('请先计算最优升级方案！');
                return;
            }
            
            const equipmentIndex = ['衣服', '裤子', '指环', '手杖', '帽子', '怀表'].indexOf(currentBestOption.equipment);
            const equipmentElements = [
                document.getElementById('clothes'),
                document.getElementById('pants'),
                document.getElementById('ring'),
                document.getElementById('staff'),
                document.getElementById('hat'),
                document.getElementById('watch')
            ];
            
            // 更新装备等级
            equipmentElements[equipmentIndex].value = currentBestOption.nextLevel;
            
            // 更新颜色
            updateSelectColor(equipmentElements[equipmentIndex]);
            
            // 保存状态
            saveEquipmentState();
            
            // 高亮显示更新的装备
            highlightEquipment(equipmentIndex);
            
            // 重新计算最优方案
            calculateBestUpgrade();
        }

        // 开始自动升级
        function startAutoUpgrade() {
            if (isAutoUpgrading) return;
            
            isAutoUpgrading = true;
            document.getElementById('auto-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'block';
            
            const statusElement = document.getElementById('status');
            statusElement.style.display = 'block';
            statusElement.textContent = '自动升级中...';
            
            // 先计算一次
            calculateBestUpgrade();
            
            // 设置定时器
            autoUpgradeInterval = setInterval(() => {
                if (!currentBestOption || currentBestOption.nextLevel === '无法升级') {
                    stopAutoUpgrade();
                    statusElement.textContent = '自动升级完成！所有装备已升至最高等级。';
                    return;
                }
                
                acceptUpgrade();
            }, 1000);
        }

        // 停止自动升级
        function stopAutoUpgrade() {
            if (autoUpgradeInterval) {
                clearInterval(autoUpgradeInterval);
                autoUpgradeInterval = null;
            }
            
            isAutoUpgrading = false;
            document.getElementById('auto-btn').style.display = 'block';
            document.getElementById('stop-btn').style.display = 'none';
            
            const statusElement = document.getElementById('status');
            statusElement.textContent = '自动升级已停止。';
        }

        // 根据装备等级确定稀有度类
        function getRarityClass(level) {
            if (level.includes('神话')) return 'rarity-mythical';
            if (level.includes('传说')) return 'rarity-legendary';
            if (level.includes('史诗')) return 'rarity-epic';
            if (level.includes('稀有')) return 'rarity-rare';
            if (level.includes('良好')) return 'rarity-common';
            return '';
        }

        // 更新单个选择的颜色
        function updateSelectColor(selectElement) {
            // 移除所有稀有度类
            selectElement.classList.remove('rarity-common', 'rarity-rare', 'rarity-epic', 'rarity-legendary', 'rarity-mythical');
            
            // 添加适当的稀有度类
            const rarityClass = getRarityClass(selectElement.value);
            if (rarityClass) {
                selectElement.classList.add(rarityClass);
            }
        }

        // 保存装备状态到localStorage
        function saveEquipmentState() {
            const equipmentElements = [
                document.getElementById('clothes'),
                document.getElementById('pants'),
                document.getElementById('ring'),
                document.getElementById('staff'),
                document.getElementById('hat'),
                document.getElementById('watch')
            ];
            
            const equipmentState = {};
            equipmentElements.forEach((element, index) => {
                equipmentState[`equipment_${index}`] = element.value;
            });
            
            localStorage.setItem('equipmentState', JSON.stringify(equipmentState));
        }

        // 从localStorage加载装备状态
        function loadEquipmentState() {
            const savedState = localStorage.getItem('equipmentState');
            if (savedState) {
                const equipmentState = JSON.parse(savedState);
                const equipmentElements = [
                    document.getElementById('clothes'),
                    document.getElementById('pants'),
                    document.getElementById('ring'),
                    document.getElementById('staff'),
                    document.getElementById('hat'),
                    document.getElementById('watch')
                ];
                
                equipmentElements.forEach((element, index) => {
                    const savedValue = equipmentState[`equipment_${index}`];
                    if (savedValue && element.querySelector(`option[value="${savedValue}"]`)) {
                        element.value = savedValue;
                        updateSelectColor(element);
                    }
                });
            }
        }

        // 重置装备到最低等级
        function resetEquipment() {
            const equipmentElements = [
                document.getElementById('clothes'),
                document.getElementById('pants'),
                document.getElementById('ring'),
                document.getElementById('staff'),
                document.getElementById('hat'),
                document.getElementById('watch')
            ];
            
            equipmentElements.forEach(element => {
                element.value = '良好';
                updateSelectColor(element);
            });
            
            // 保存状态
            saveEquipmentState();
            
            // 重新计算
            calculateBestUpgrade();
            
            // 显示提示
            const statusElement = document.getElementById('status');
            statusElement.style.display = 'block';
            statusElement.textContent = '已重置所有装备到最低等级。';
            
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 3000);
        }

        // 计算最优升级方案
        function calculateBestUpgrade() {
            const equipmentElements = [
                document.getElementById('clothes'),
                document.getElementById('pants'),
                document.getElementById('ring'),
                document.getElementById('staff'),
                document.getElementById('hat'),
                document.getElementById('watch')
            ];
            
            const currentLevels = equipmentElements.map(el => el.value);
            const currentStats = calculateTotalStats(currentLevels);
            
            let bestOption = null;
            let bestValue = 0;
            const options = [];
            
            // 检查每件装备是否可以升级
            for (let i = 0; i < equipmentElements.length; i++) {
                const currentLevel = currentLevels[i];
                const nextLevel = getNextLevel(currentLevel);
                
                if (!nextLevel) {
                    options.push({
                        equipment: ['衣服', '裤子', '指环', '手杖', '帽子', '怀表'][i],
                        currentLevel,
                        nextLevel: '无法升级',
                        value: 0,
                        costIncrease: 0
                    });
                    continue;
                }
                
                // 计算升级后的属性
                const newLevels = [...currentLevels];
                newLevels[i] = nextLevel;
                const newStats = calculateTotalStats(newLevels);
                
                // 计算属性增加值
                const statsIncrease = newStats - currentStats;
                
                // 计算价格增加值
                const currentPrice = equipmentData[currentLevel].price;
                const nextPrice = equipmentData[nextLevel].price;
                const costIncrease = nextPrice - currentPrice;
                
                // 计算性价比
                const value = statsIncrease / costIncrease;
                
                options.push({
                    equipment: ['衣服', '裤子', '指环', '手杖', '帽子', '怀表'][i],
                    currentLevel,
                    nextLevel,
                    value,
                    costIncrease,
                    statsIncrease
                });
                
                // 更新最优选项
                if (value > bestValue) {
                    bestValue = value;
                    bestOption = options[options.length - 1];
                }
            }
            
            // 保存当前最优选项到全局变量
            currentBestOption = bestOption;
            
            // 显示结果
            let resultHTML = '<h2>升级选项分析</h2><ul>';
            
            options.forEach(option => {
                if (option.nextLevel === '无法升级') {
                    resultHTML += `<li>${option.equipment}: 当前等级 ${option.currentLevel}，无法继续升级</li>`;
                } else {
                    const isBest = option === bestOption ? 'class="best-option"' : '';
                    resultHTML += `<li ${isBest}>${option.equipment}: 从 ${option.currentLevel} 升级到 ${option.nextLevel}，`;
                    resultHTML += `属性增加 ${option.statsIncrease.toFixed(6)}，花费 ${option.costIncrease}，`;
                    resultHTML += `性价比 = ${option.value.toFixed(6)}</li>`;
                }
            });
            
            resultHTML += '</ul>';
            
            if (bestOption) {
                resultHTML += `<p class="best-option">最优升级方案: 升级 ${bestOption.equipment} 到 ${bestOption.nextLevel}，性价比 = ${bestOption.value.toFixed(6)}</p>`;
            } else {
                resultHTML += `<p>所有装备均已达到最高等级，无法继续升级。</p>`;
            }
            
            document.getElementById('result').innerHTML = resultHTML;
        }

        // 初始化页面
        window.onload = function() {
            // 加载保存的状态
            loadEquipmentState();
            
            // 为所有选择框添加change事件监听器
            const equipmentElements = [
                document.getElementById('clothes'),
                document.getElementById('pants'),
                document.getElementById('ring'),
                document.getElementById('staff'),
                document.getElementById('hat'),
                document.getElementById('watch')
            ];
            
            equipmentElements.forEach(element => {
                element.addEventListener('change', function() {
                    updateSelectColor(this);
                    saveEquipmentState();
                });
            });
            
            // 初始计算
            calculateBestUpgrade();
        };
    </script>
